onboarding = false

# BEGIN nbshell managed theme
[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
sidebar_bg = "#13141c"
active_row_bg = "#24283b"
selection_bg = "#292e42"
panel_bg = "#1a1b26"
accent = "#7aa2f7"
red = "#f7768e"
green = "#9ece6a"
# END nbshell managed theme

[experimental]
kitty_graphics = true

[ui]
status_indicators = "symbols"

show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
[ui.toast]
delivery = "terminal"

# lazygit
[[keys.command]]              # lazygit: open in a split
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"
description = "open lazygit in split pane"

[[keys.command]]              # lazygit: open in its own tab
key = "prefix+shift+g"
type = "plugin_action"
command = "herdr-lazygit.open-tab"
description = "open lazygit in new tab"

# scratch
[[keys.command]]
key         = "prefix+'"
type        = "plugin_action"
command     = "user.scratch.toggle"
description = "scratch shell"

# yazi
[[keys.command]]              # open in a split pane
key = "prefix+y"
type = "plugin_action"
command = "ray.file-explorer.open"
description = "open file explorer"

[[keys.command]]              # open in a new tab
key = "prefix+Y"
type = "plugin_action"
command = "ray.file-explorer.open-tab"
description = "open file explorer in a new tab"

# herdr-mirror
[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "mirror.start"       # start / resume the daemon
description = "remote-start"

[[keys.command]]              # one-shot sync pass; no daemon needed
key = "prefix+alt+o"
type = "plugin_action"
command = "mirror.once"
description = "remote-once"

[[keys.command]]              # log daemon / host / mirror-object status
key = "prefix+shift+i"
type = "plugin_action"
command = "mirror.status"
description = "remote-status"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "mirror.pause"       # freeze syncing; start again to resume
description = "remote-pasue"

[[keys.command]]
key = "prefix+shift+b"         # "bring back" (shift+r is native reload_config)
type = "plugin_action"
command = "mirror.restore"     # un-close mirrors you closed locally
description = "remote-restore"

[[keys.command]]
key = "prefix+alt+d"           # destructive: closes ALL mirrors + clears state
type = "plugin_action"
command = "mirror.teardown"    # stop mirroring everything (start to resume)
description = "remote-teardown"

# Create objects on the REMOTE host, or locally when invoked outside a mirror.
# Each is herdr's native local key + alt (Option): same muscle memory, remote
# target.
[[keys.command]]
key = "prefix+alt+n"           # native new_workspace = prefix+shift+n
type = "plugin_action"
command = "mirror.remote-new-workspace"
description = "remote-new-workspace"

[[keys.command]]
key = "prefix+alt+c"           # native new_tab = prefix+c
type = "plugin_action"
command = "mirror.remote-new-tab"
description = "remote-new-tab"

[[keys.command]]
key = "prefix+alt+v"           # native split_vertical = prefix+v
type = "plugin_action"
command = "mirror.remote-split-right"
description = "remote-split-right"

[[keys.command]]
key = "prefix+alt+minus"       # native split_horizontal = prefix+minus
type = "plugin_action"
command = "mirror.remote-split-down"
description = "remote-split-down"

# plugin-manager
[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

# navigator
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

# navigator: side pane + jump back
[[keys.command]]
key = "prefix+alt+s"          # side panel (prefix+t = popup)
type = "plugin_action"
command = "herdr-navigator.open-side"
description = "open navigator side pane"

[[keys.command]]
key = "prefix+alt+g"          # alt+j freed for pane resize (prefix+alt+h/j/k/l)
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "jump back to previous location"

# Native pane/tab moves (unset by default; herdr swaps/moves in place).
# swap = focus chord + shift: same direction muscle memory as focus h/j/k/l.
[keys]
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# pane resize: direct shortcuts (no prefix). alt+hjkl is taken system-wide by
# AeroSpace, so plain Option combos never reach the terminal.
# ctrl+alt+hjkl first (vim muscle memory); ctrl+alt+arrows as reliable fallback
# (standard CSI sequences ESC[1;3D). Ctrl+h/j/k/l are BS/LF/VT/FF control
# chars, so if hjkl never fires on your setup, just use the arrows.
resize_pane_left  = ["ctrl+alt+h", "ctrl+alt+left"]
resize_pane_down  = ["ctrl+alt+j", "ctrl+alt+down"]
resize_pane_up    = ["ctrl+alt+k", "ctrl+alt+up"]
resize_pane_right = ["ctrl+alt+l", "ctrl+alt+right"]

# token-dashboard
# herdr ignores [[keys.command]] inside plugin manifests, so the plugin's own
# 'prefix+$' binding is dead; bind the action explicitly here.
[[keys.command]]
key = "prefix+$"
type = "plugin_action"
command = "dave.token-dashboard.open-dashboard"
description = "open token dashboard"

# navigator
[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "herdr-workspacer.open"
description = "open workspace picker"
