# Seed for ~/.config/fcitx5/conf/classicui.conf, copied by fcitx5/install.sh
# when that file is missing. The copy is runtime state and stays out of git:
# fcitx5 addons rewrite it in place, and so does the desktop theme script.
#
# Theme is desktop-owned: fcitx5/install.sh points it at the theme the running
# desktop generates — `Nbshell` when nbshell's config is linked (its theme-hook.sh
# rebuilds that theme from the palette), `omarchy` otherwise (Omarchy's
# omarchy-theme-set-fcitx5 rebuilds it on every theme switch). A theme chosen in
# fcitx5-configtool is never overwritten.
Theme=default
DarkTheme=default
UseDarkTheme=False
UseAccentColor=False

# Candidate window
Vertical Candidate List=False
WheelForPaging=True
PreferTextIcon=False
ShowLayoutNameInIcon=True
UseInputMethodLanguageToDisplayText=True
Font="JetBrainsMono Nerd Font 12"
MenuFont="JetBrainsMono Nerd Font 11"
TrayFont="JetBrainsMono Nerd Font Bold 11"

# Wayland scales natively; per-screen DPI is an X11-only concern.
EnableFractionalScale=True
ForceWaylandDPI=0
PerScreenDPI=False
