# Managed by nbshell theme synchronization.
# The generated Nbshell theme follows the active nbshell palette.
# Vertical Candidate List
Vertical Candidate List=False
# Use mouse wheel to go to prev or next page
WheelForPaging=True
# Font
Font="JetBrainsMono Nerd Font 12"
# Menu Font
MenuFont="JetBrainsMono Nerd Font 11"
# Tray Font
TrayFont="JetBrainsMono Nerd Font Bold 11"
# Prefer Text Icon
PreferTextIcon=False
# Show Layout Name In Icon
ShowLayoutNameInIcon=True
# Use input method language to display text
UseInputMethodLanguageToDisplayText=True
# Theme
Theme=Nbshell
# Dark Theme
DarkTheme=Nbshell
# Use the generated palette directly; do not substitute a desktop theme.
UseDarkTheme=False
UseAccentColor=False
# Use Per Screen DPI on X11
PerScreenDPI=False
# Force font DPI on Wayland
ForceWaylandDPI=0
# Enable fractional scale under Wayland
EnableFractionalScale=True
