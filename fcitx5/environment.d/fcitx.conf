# fcitx5 input method environment.
# niri/config.kdl relies on this file: the build has no `env` node, so systemd's
# environment.d(5) import is what gives every session the IM variables.
GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
SDL_IM_MODULE=fcitx
GLFW_IM_MODULE=ibus
INPUT_METHOD=fcitx
IMSETTINGS_MODULE=fcitx
