# fcitx5 input method environment for Wayland desktops (Omarchy/Hyprland, niri).
# Imported by systemd's environment.d(5) at login, which is what hands the IM
# variables to every session — niri's config has no `env` node to do it.
#
# GTK_IM_MODULE and IMSETTINGS_MODULE are deliberately absent. GTK3/GTK4 talk to
# fcitx5 over text-input-v3, which Hyprland and niri implement natively, and
# these variables are global to every process: setting them pushes native
# Wayland GTK apps onto the legacy im-module path. Omarchy reasons the same way
# in /usr/lib/environment.d/90-try-omarchy.conf.
# QT_IM_MODULE stays for Qt5, which has no text-input-v3; Qt6 ignores it and
# uses the native protocol.
# XWayland clients only speak XIM, hence XMODIFIERS. SDL2 has no text-input-v3
# either, and GLFW's IBus protocol is what Minecraft-style launchers expect.
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
SDL_IM_MODULE=fcitx
GLFW_IM_MODULE=ibus
INPUT_METHOD=fcitx
