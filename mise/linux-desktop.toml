# mise toolchain for `dotfiles setup linux omarchy` / `linux niri`.
# Desktop components (niri, quickshell, fcitx5, kitty) stay in pacman;
# this file owns the cross-platform CLI layer.
[tools]
neovim = "0.12.5"
node = "22.23.2"
go = "latest"
rust = "latest"
yazi = "26.9.1"
fastfetch = "2.68.1"
tmux = "latest"
lazygit = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
# herdr has no Arch package; ubi pulls the release binary
# (assets are named herdr-linux-x86_64 / herdr-linux-aarch64).
"ubi:herdrdev/herdr" = "0.8.2"
