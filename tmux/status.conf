# Kaku 风格底部状态栏 — 对齐 kaku.lua 的 set_right_status (CPU% | 内存% | 时间)
# 由 ~/.tmux.conf 在 Kaku 托管的 kaku.tmux.conf 之后 source, 避免被 Kaku.app 覆盖
# 图标: md_cpu_64_bit U+F0EE0, md_memory U+F035B, md_clock_time_four_outline U+F144E
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#15141b,fg=#d5d4d6"

# 左侧: CPU (kaku 绿 #58d8ad)
set -g status-left "#[fg=#58d8ad]󰻠 #{cpu_percentage}#[fg=#d5d4d6] "
set -g status-left-length 20

# 右侧: 内存 | 时间 (kaku 蓝 #68afda + 亮蓝 #90c9e6, 分隔灰 #6d6d6d)
set -g status-right "#[fg=#6d6d6d]│ #[fg=#68afda]󰍛 #{ram_percentage} #[fg=#6d6d6d]│ #[fg=#90c9e6]󱑎 %H:%M "
set -g status-right-length 60

# 中间窗口列表: 弱化, 保持 Kaku Dark 氛围
set -g status-justify left
set -g window-status-style "fg=#6d6d6d,bg=default"
set -g window-status-current-style "fg=#d5d4d6,bg=default,bold"
set -g window-status-separator " "
