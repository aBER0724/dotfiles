# kitty.conf — 参考 Kaku (WezTerm) 移植的终端配置
# Ported from ~/dotfiles/kaku/kaku.lua + Kaku Dark palette (from Kaku.app bundle).
# 主题: Kaku Dark (Aura 系)。字体: IoskeleyMonoTerm Nerd Font。
# 同时保留 nbshell 联动 (archlinux): include 的 nbshell 配色在后生效, 有则覆盖 Kaku 基色。
# vim:fileencoding=utf-8:foldmethod=marker

#: Fonts {{{
# 与 kaku.lua 一致: 主字体 IoskeleyMonoTerm Nerd Font,
# 斜体用 JetBrainsMono Nerd Font 的 Italic, CJK 由系统字体自动回退 (PingFang SC 等)。
font_family          IoskeleyMonoTerm Nerd Font
italic_font          auto
bold_font            auto
bold_italic_font     auto
# Kitty exposes KITTY_OS (linux/macos/bsd) while expanding include paths.
include platform-${KITTY_OS}.conf
# kaku 用 line_height 0.8 收紧行距; kitty 0.48 的 adjust_line_height 已弃用, 保留默认行高
font_features        IoskeleyMonoTerm Nerd Font +calt +clig +liga
disable_ligatures    never
#: }}}

#: Cursor {{{
# kaku: BlinkingBar + 2px 竖线 + 不闪烁
cursor_shape         beam
cursor_beam_thickness 2.0
cursor_blink_interval 0
#: }}}

#: Scrollback {{{
scrollback_lines     10000
#: }}}

#: Mouse {{{
# kaku: 松开鼠标即完成选择并复制; Cmd+点击打开链接
copy_on_select           yes
# kaku selection_word_boundary = ' \t\n{}[]()"\'-' (括号/引号/连字符不并入单词)
select_by_word_characters @#$%^&*=_+,.;:/~
# kaku: 普通左键 = 选择并复制, Cmd+点击 = 打开链接 (kitty 默认单击即开链接, 此处覆盖)
mouse_map left click          ungrabbed mouse_handle_click selection
mouse_map cmd+left click      ungrabbed mouse_handle_click link
mouse_map cmd+left press      grabbed discard_event
#: }}}

#: Window {{{
background_opacity            1.0
# Uniform 24pt padding on Linux and macOS.
window_padding_width          24
initial_window_width          110c
initial_window_height         22c
remember_window_size          no
# kaku: window_decorations=RESIZE (无标题栏) → 彻底隐藏标题栏与交通灯; 关闭/最小化用 Cmd+W / Cmd+M
hide_window_decorations   yes
placement_strategy            center
#: }}}

#: Tab Bar {{{
# kaku: 底部文本 tab bar、始终显示、显示序号
tab_bar_edge          bottom
tab_bar_min_tabs      1
tab_bar_style         fade
tab_separator         " "
tab_title_template    "{index} {title}"
shell_integration     enabled
#: }}}

#: Shell {{{
shell                 /bin/zsh -l
#: }}}

#: macOS {{{
macos_option_as_alt   yes
macos_quit_when_last_window_closed no
#: }}}

#: Colors — Kaku Dark (Aura Dark 系) {{{
# Kaku Dark palette (from Kaku.app bundle kaku.lua):
#   bg #15141b / fg #d5d4d6 / surface #1f1d28 / surface_active #29263c
#   gray #6d6d6d / red #d85d5d / green #58d8ad / orange #daae76
#   blue #68afda / bright_blue #90c9e6 / purple #8e6ad9 / pink #d383da
background            #15141b
foreground            #d5d4d6

selection_background  #8e6ad9
selection_foreground  #d5d4d6

cursor                #8e6ad9
cursor_text_color     #15141b

url_color             #90c9e6

# ANSI 0-15 — 与 Kaku Dark 完全一致
# (Kaku 把 ANSI black 前景渲染成浅色 #c8c6cc 提高深底上的可读性)
color0  #c8c6cc
color1  #d85d5d
color2  #58d8ad
color3  #daae76
color4  #68afda
color5  #8e6ad9
color6  #58d8ad
color7  #d5d4d6
color8  #6d6d6d
color9  #d85d5d
color10 #58d8ad
color11 #daae76
color12 #90c9e6
color13 #8e6ad9
color14 #58d8ad
color15 #d5d4d6

# Tab bar 配色 (Kaku 的 tab_bar 项: bg #15141b / active #29263c / inactive #6d6d6d)
tab_bar_background          #15141b
active_tab_background       #29263c
active_tab_foreground       #d5d4d6
inactive_tab_background     #15141b
inactive_tab_foreground     #6d6d6d
#: }}}

#: Keymap — 与 kaku.lua 完全对齐的 macOS Cmd 键位 {{{
map cmd+q quit
map cmd+shift+r load_config_file
map cmd+shift+. load_config_file

map cmd+n new_os_window
map cmd+w close_window
map cmd+shift+w close_tab
map cmd+t new_tab
map cmd+ctrl+f toggle_fullscreen
map cmd+m minimize_macos_window
map cmd+h hide_macos_app

map cmd+= increase_font_size
map cmd+- decrease_font_size
map cmd+0 reset_font_size

# 词级 / 行级移动 (kaku: Opt+←→ 发 Alt+b/f; Cmd+←→ 发 Ctrl+a/e)
map opt+left       send_text all \eb
map opt+right      send_text all \ef
map cmd+left       send_text all \x01
map cmd+right      send_text all \x05

# 删除 (kaku: Cmd+Backspace = Ctrl+u 删到行首; Opt+Backspace = Ctrl+w 删一词)
map cmd+backspace  send_text all \x15
map opt+backspace  send_text all \x17

# Cmd+S 保存 (转发为 Ctrl+S, 兼容 nvim)
map cmd+s          send_text all \x13

# 分屏 (kaku: Cmd+D 左右; Cmd+Shift+D 上下)
map cmd+d          launch --location=vsplit
map cmd+shift+d    launch --location=hsplit

map cmd+shift+[    previous_tab
map cmd+shift+]    next_tab

# 分屏间导航 (kaku: Cmd+Opt+方向键 / hjkl)
map cmd+opt+left   neighboring_window left
map cmd+opt+right  neighboring_window right
map cmd+opt+up     neighboring_window up
map cmd+opt+down   neighboring_window down
map cmd+opt+h      neighboring_window left
map cmd+opt+j      neighboring_window down
map cmd+opt+k      neighboring_window up
map cmd+opt+l      neighboring_window right

# 缩放分屏 (kaku: Cmd+Shift+Enter 放大/还原)
map cmd+shift+enter toggle_layout stack

# 调整分屏大小 (kaku: Cmd+Ctrl+方向键 / hjkl, 步进 5)
map cmd+ctrl+left  resize_window left 5
map cmd+ctrl+right resize_window right 5
map cmd+ctrl+up    resize_window up 5
map cmd+ctrl+down  resize_window down 5
map cmd+ctrl+h     resize_window left 5
map cmd+ctrl+j     resize_window down 5
map cmd+ctrl+k     resize_window up 5
map cmd+ctrl+l     resize_window right 5

# 标签切换 (kaku: Cmd+1~9)
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# 仅插入换行 (kaku: Cmd+Enter / Shift+Enter)
map cmd+enter      send_text all \r
map shift+enter    send_text all \r
#: }}}

#: nbshell integration (Linux + macOS) {{{
# Dynamic colors are optional: Linux nbshell generates this file; macOS falls
# back to the Kaku palette above when it is absent.
include ~/.config/nbshell/kitty.conf
allow_remote_control socket-only
# Relative Unix socket paths are resolved by Kitty inside the platform temporary
# directory on Linux and macOS. The PID keeps OS processes addressable.
listen_on unix:kitty-{kitty_pid}.sock
confirm_os_window_close 0
map f11 toggle_fullscreen
#: }}}

# 未移植: kaku 右下角的 CPU/内存/时钟状态栏 (WezTerm 特性, kitty 无内置等价物;
# 可用 kitty @ 轮询脚本或 desktop_ui kitten 自行实现)。
# Inactive pane 不调暗 (kaku inactive_pane_hsb 1.0) — kitty 默认 inactive_text_alpha=1.0, 无需配置。

# macOS 专属窗口效果(半透明 + 模糊):
# kitty 用 ${KITTY_OS} 决定文件名(linux/macos/bsd);mac 加载 macos.conf,
# arch 上 linux.conf 不存在 → include 被静默忽略,不影响 Linux。
include $HOME/dotfiles/kitty/${KITTY_OS}.conf
