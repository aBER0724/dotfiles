# Kitty terminal configuration
# vim:fileencoding=utf-8:foldmethod=marker

#: Fonts {{{
# Primary font with automatic bold, italic, and CJK fallback.
font_family          JetBrainsMono Nerd Font
italic_font          auto
bold_font            auto
bold_italic_font     auto
# Load platform-specific font size.
include platform-${KITTY_OS}.conf
# Slightly increase line spacing without inserting blank rows.
modify_font cell_height 150%
font_features        JetBrainsMono Nerd Font +calt +clig +liga
disable_ligatures    never
#: }}}

#: Cursor {{{
# Smoothly fade the block cursor out and back in every second.
cursor_shape          block
cursor_blink_interval 0.5 ease-in-out
# Smooth native cursor trail for navigation and jumps.
cursor_trail         3
cursor_trail_decay   0.1 0.25
cursor_trail_start_threshold 2
#: }}}

#: Scrollback {{{
scrollback_lines     10000
#: }}}

#: Mouse {{{
# Copy selections automatically; Cmd+click opens links.
copy_on_select           yes
select_by_word_characters @#$%^&*=_+,.;:/~
mouse_map left click          ungrabbed mouse_handle_click selection
mouse_map cmd+left click      ungrabbed mouse_handle_click link
mouse_map cmd+left press      grabbed discard_event
#: }}}

#: Window {{{
background_opacity            1.0
# Panes 紧贴排列；padding 会在 pane 之间制造缝隙
# Equal content padding on all four sides: left top right bottom
window_padding_width          24 24 24 24
# Remove gaps between split panes and around single panes
# Keep panes tight; Kitty does not support inset separator lines
window_margin_width         0
single_window_margin_width   0
initial_window_width          110c
initial_window_height         22c
remember_window_size          no
# Pane borders: active pane highlighted in Tokyo Night blue
window_border_width        1px
active_border_color        #89b4fa
inactive_border_color      #313244
bell_border_color          #f38ba8
draw_minimal_borders       yes
# Hide the title bar and macOS traffic lights.
hide_window_decorations   yes
placement_strategy            center
#: }}}

#: Tab Bar {{{
# 自定义 tab bar: 左侧 separator 风格的 tab 列表 + 右侧系统状态 (CPU/Mem/时间)
# 状态采集在 watcher.py 后台线程里跑, tab_bar.py 只读缓存文件渲染.
tab_bar_edge          bottom
tab_bar_min_tabs      1
tab_bar_style         custom
tab_powerline_style   angled
# Keep tab typography stable across reloads and full restarts.
active_tab_font_style   bold
inactive_tab_font_style normal
# tab_bar.py resolves titles to cwd basename for shells or foreground executable.
tab_title_max_length  0
tab_title_template    " {index} {custom} "
# watcher.py 启动后台线程定期刷新状态并触发重绘
watcher               watcher.py
shell_integration     enabled no-cursor
#: }}}

#: Shell {{{
shell                 /bin/zsh -l
#: }}}

#: macOS {{{
macos_option_as_alt   yes
macos_quit_when_last_window_closed no
#: }}}

#: Colors {{{
# Catppuccin Mocha — softer contrast for long terminal sessions.
background            #1e1e2e
foreground            #cdd6f4

selection_background  #45475a
selection_foreground  #cdd6f4

cursor                #f5e0dc
cursor_text_color     #1e1e2e

url_color             #89b4fa

# ANSI colors.
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# Tab bar colors.
tab_bar_background          #11111b
active_tab_background       #313244
active_tab_foreground       #cdd6f4
inactive_tab_background     #181825
inactive_tab_foreground     #a6adc8
#: }}}

#: Keymap {{{
map cmd+q quit
# Clipboard and config reload.
map cmd+c        send_text all \x1b[99;9u
map cmd+v        paste_from_clipboard
map cmd+shift+v  paste_from_clipboard
map cmd+shift+r load_config_file
map cmd+shift+. load_config_file

# Windows and tabs.
map cmd+n new_os_window
map cmd+w close_window
map cmd+shift+w close_tab
map cmd+t new_tab
map cmd+ctrl+f toggle_fullscreen
map cmd+m minimize_macos_window
map cmd+h hide_macos_app

# Font size.
map cmd+= increase_font_size
map cmd+- decrease_font_size
map cmd+0 reset_font_size

# Splits.
map cmd+d          combine : goto_layout splits : launch --location=vsplit
map shift+cmd+d    combine : goto_layout splits : launch --location=hsplit

# Shell-style cursor movement and deletion.
map opt+left       send_text all \eb
map opt+right      send_text all \ef
map cmd+left       send_text all \x01
map cmd+right      send_text all \x05
map cmd+backspace  send_text all \x15
map opt+backspace  send_text all \x17
map cmd+s          send_text all \x13

# Tab navigation.
map cmd+shift+[    previous_tab
map cmd+shift+]    next_tab

# Split navigation.
map cmd+opt+left   neighboring_window left
map cmd+opt+right  neighboring_window right
map cmd+opt+up     neighboring_window up
map cmd+opt+down   neighboring_window down
map cmd+opt+h      neighboring_window left
map cmd+opt+j      neighboring_window down
map cmd+opt+k      neighboring_window up
map cmd+opt+l      neighboring_window right
map cmd+shift+enter toggle_layout stack

# Split resizing.
map cmd+ctrl+left  kitten resize_separator.py left
map cmd+ctrl+right kitten resize_separator.py right
map cmd+ctrl+up    kitten resize_separator.py up
map cmd+ctrl+down  kitten resize_separator.py down
map cmd+ctrl+h     kitten resize_separator.py left
map cmd+ctrl+j     kitten resize_separator.py down
map cmd+ctrl+k     kitten resize_separator.py up
map cmd+ctrl+l     kitten resize_separator.py right

# Direct tab selection.
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Insert a newline.
map cmd+enter      send_text all \r
map shift+enter    send_text all \r
#: }}}

#: nbshell integration (Linux + macOS) {{{
# Optional dynamic nbshell colors.
include ~/.config/nbshell/kitty.conf
allow_remote_control socket-only
# Per-process control socket used by the status integration.
listen_on unix:kitty-{kitty_pid}.sock
confirm_os_window_close 0
map f11 toggle_fullscreen
#: }}}
