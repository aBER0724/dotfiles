# Kitty terminal configuration managed by dotfiles.
# Dynamic colors are generated from the active nbshell palette.
include ~/.config/nbshell/kitty.conf

font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10.0

window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0

# Allow theme-sync.py to recolor already-running Kitty windows.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

map f11 toggle_fullscreen
