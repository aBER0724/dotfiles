# macOS 专属:半透明背景 + 背景模糊
#
# 由 kitty.conf 末尾的 `include $HOME/dotfiles/kitty/${KITTY_OS}.conf` 自动加载:
#   macOS → 解析为 macos.conf → 本文件生效
#   Linux → 解析为 linux.conf(不存在)→ 被忽略,arch 上 kitty 保持不透明
#
# 注意:
#   * background_blur 仅 macOS 有效(Linux 上被忽略),且只在
#     background_opacity < 1 时起作用(0.48 中 blur 是整数像素半径)。
#   * 值调整:opacity 0.8~0.95 半透明程度;blur 10~30 模糊半径。
#   * 若想给 blur 后的背景上一点暗色提高可读性,可加 background_tint 0.2~0.5。
background_opacity            0.85
background_blur               20